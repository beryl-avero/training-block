<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Neon Glow Gradient -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#6366f1"/>
      <stop offset="80%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <!-- Speed Gold Accent -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Rounded Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="url(#neonGrad)" stroke-width="8"/>

  <!-- Inner Subtle Border -->
  <rect x="28" y="28" width="456" height="456" rx="100" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>

  <!-- Speed Motion Trails -->
  <path d="M 80 270 L 170 270" stroke="url(#neonGrad)" stroke-width="6" stroke-linecap="round" opacity="0.4"/>
  <path d="M 60 305 L 150 305" stroke="url(#neonGrad)" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
  <path d="M 90 340 L 190 340" stroke="url(#neonGrad)" stroke-width="6" stroke-linecap="round" opacity="0.4"/>

  <!-- Stylized Dynamic Runner Silhouette -->
  <g filter="url(#glow)">
    <!-- Runner Head -->
    <circle cx="315" cy="145" r="28" fill="url(#neonGrad)"/>

    <!-- Runner Torso & Motion Body -->
    <path d="M 275 195 C 295 180, 325 185, 345 205 L 295 285 L 255 240 Z" fill="url(#neonGrad)"/>

    <!-- Front Leg & Knee Drive (High Cadence) -->
    <path d="M 295 285 L 365 315 L 390 395" fill="none" stroke="url(#neonGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Back Leg & Push Off Power -->
    <path d="M 265 260 L 210 325 L 145 345" fill="none" stroke="url(#neonGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Lead Arm Forward -->
    <path d="M 315 205 L 375 225 L 415 190" fill="none" stroke="url(#neonGrad)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Trail Arm Driving Back -->
    <path d="M 285 215 L 235 235 L 195 205" fill="none" stroke="url(#neonGrad)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Typography: VHM -->
  <text x="256" y="445" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="52" fill="#ffffff" letter-spacing="4">
    VHM <tspan fill="url(#neonGrad)">SUB 2</tspan>
  </text>

  <!-- Small Target Badge (21.1K) -->
  <g transform="translate(350, 60)">
    <rect width="96" height="34" rx="17" fill="rgba(244,63,94,0.2)" stroke="#f43f5e" stroke-width="2"/>
    <text x="48" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="14" fill="#fda4af" letter-spacing="1">21.1 KM</text>
  </g>
</svg>

